[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "llamba_library"
version = "0.1.12"
description = "A library to merge BioAge models with LLMs!"
readme = "README.md"
authors = [
  "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
  "Mike Krivonosov <krivonosov@itmm.unn.ru>"
]
maintainers = [
    "Sergei Tikhomirov <sergey.zr.co.uk@gmail.com>", 
    "Mike Krivonosov <krivonosov@itmm.unn.ru>"
]
repository = "https://github.com/mike-live/llamba_library"
packages = [
  {include = "llamba_library", from = "./"}
]

[tool.poetry.dependencies]
#python = "3.11.*"
python = ">=3.11,<3.13"
torch = {version = ">=2.3.1,<2.12.0", source = "torch-cpu"}
torchvision = {version = ">=0.18.1,<0.27.0", source = "torch-cpu"}
torchaudio = {version = ">=2.3.1,<2.12.0", source = "torch-cpu"}
pytorch_lightning = "2.1.4"
numpy = ">=1,<3.0.0"
shap = "*"
pandas = ">=2.2.3,<4.0.0"
torchmetrics = "1.2.1"
seaborn = "*"
matplotlib = ">=3.9.3,<4.0.0"
openpyxl = "^3.1.5"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"



[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
